<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <!-- Horizon line -->
  <line x1="50" y1="490" x2="550" y2="490" stroke="#FFFFFF" stroke-width="1.5" opacity="0.25"/>
  <!-- Sun circle -->
  <circle cx="300" cy="370" r="90" fill="#0D2B4E" stroke="#B8952A" stroke-width="3"/>
  <circle cx="300" cy="370" r="68" fill="#B8952A" opacity="0.15"/>
  <circle cx="300" cy="370" r="42" fill="#B8952A" opacity="0.3"/>
  <circle cx="300" cy="370" r="22" fill="#B8952A" opacity="0.8"/>
  <!-- Sun rays -->
  <g stroke="#B8952A" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="300" y1="255" x2="300" y2="225"/><!-- top -->
    <line x1="300" y1="485" x2="300" y2="515"/><!-- bottom -->
    <line x1="185" y1="370" x2="155" y2="370"/><!-- left -->
    <line x1="415" y1="370" x2="445" y2="370"/><!-- right -->
    <!-- diagonals -->
    <line x1="219" y1="289" x2="199" y2="269"/>
    <line x1="381" y1="289" x2="401" y2="269"/>
    <line x1="219" y1="451" x2="199" y2="471"/>
    <line x1="381" y1="451" x2="401" y2="471"/>
  </g>
  <!-- Landscape silhouette below horizon -->
  <path d="M50,490 Q150,460 250,490 Q350,520 450,480 Q500,465 550,490 L550,610 L50,610 Z" fill="#0D2B4E"/>
  <path d="M50,490 Q150,460 250,490 Q350,520 450,480 Q500,465 550,490" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15"/>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="678" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#FFFFFF">Energía</text>
  <text x="50" y="724" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#FFFFFF">sin Cafeína</text>
  <text x="50" y="770" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">SALUD</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
