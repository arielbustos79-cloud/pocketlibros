<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <!-- Radiating connection lines from center -->
  <g stroke="#B8952A" stroke-width="1" opacity="0.4">
    <line x1="300" y1="350" x2="160" y2="200"/>
    <line x1="300" y1="350" x2="440" y2="200"/>
    <line x1="300" y1="350" x2="100" y2="350"/>
    <line x1="300" y1="350" x2="500" y2="350"/>
    <line x1="300" y1="350" x2="160" y2="500"/>
    <line x1="300" y1="350" x2="440" y2="500"/>
  </g>
  <!-- Outer nodes -->
  <circle cx="160" cy="200" r="16" fill="#0D2B4E" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <circle cx="440" cy="200" r="16" fill="#0D2B4E" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <circle cx="100" cy="350" r="16" fill="#0D2B4E" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <circle cx="500" cy="350" r="16" fill="#0D2B4E" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <circle cx="160" cy="500" r="16" fill="#0D2B4E" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <circle cx="440" cy="500" r="16" fill="#0D2B4E" stroke="#FFFFFF" stroke-width="1.2" opacity="0.6"/>
  <!-- Central figure silhouette -->
  <!-- Head -->
  <circle cx="300" cy="290" r="38" fill="#FFFFFF" opacity="0.9"/>
  <!-- Body -->
  <path d="M255,340 C255,340 260,460 300,470 C340,460 345,340 345,340 Q330,420 300,430 Q270,420 255,340 Z" fill="#FFFFFF" opacity="0.9"/>
  <!-- Center glow -->
  <circle cx="300" cy="350" r="55" fill="#B8952A" opacity="0.08"/>
  <circle cx="300" cy="350" r="35" fill="#B8952A" opacity="0.05"/>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="678" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#FFFFFF">Lidera</text>
  <text x="50" y="724" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#FFFFFF">sin Cargo</text>
  <text x="50" y="770" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">LIDERAZGO</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
