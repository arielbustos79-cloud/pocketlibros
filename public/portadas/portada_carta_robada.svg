<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
<defs>
  <linearGradient id="bg_carta_robada" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111111"/>
    <stop offset="100%" stop-color="#1C1C1C"/>
  </linearGradient>
  <linearGradient id="shine_carta_robada" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#B8952A" stop-opacity="0"/>
    <stop offset="50%" stop-color="#B8952A" stop-opacity="1"/>
    <stop offset="100%" stop-color="#B8952A" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Fondo -->
<rect width="600" height="900" fill="url(#bg_carta_robada)"/>

<!-- Borde rojo superior -->
<rect x="0" y="0" width="600" height="5" fill="#8B1A1A"/>

<!-- Colección top -->
<text x="300" y="38" font-family="Georgia, serif" font-size="11" fill="#B8952A" text-anchor="middle" letter-spacing="4" font-weight="normal">NOVELA NEGRA</text>
<text x="300" y="58" font-family="Georgia, serif" font-size="9" fill="#A8A8A8" text-anchor="middle" letter-spacing="3">POCKET LIBROS</text>

<!-- Línea dorada superior -->
<rect x="40" y="68" width="520" height="0.8" fill="url(#shine_carta_robada)"/>

<!-- Ilustración central -->

  <!-- Resplandor de fondo -->
  <ellipse cx="300" cy="380" rx="150" ry="120" fill="#8B1A1A" fill-opacity="0.07"/>
  <!-- Sobre (envelope) -->
  <rect x="120" y="250" width="360" height="250" rx="8" fill="#A8A8A8" fill-opacity="0.12" stroke="#A8A8A8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Solapa sobre (abierta) -->
  <path d="M120,250 L300,380 L480,250Z" fill="#A8A8A8" fill-opacity="0.18" stroke="#A8A8A8" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Líneas V del sobre (cerrado en base) -->
  <path d="M120,500 L300,370 L480,500" fill="none" stroke="#A8A8A8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Carta saliendo del sobre -->
  <rect x="195" y="190" width="210" height="170" rx="4" fill="#FFFFFF" fill-opacity="0.06" stroke="#B8952A" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Líneas texto en la carta -->
  <rect x="215" y="220" width="170" height="3" rx="1" fill="#B8952A" fill-opacity="0.35"/>
  <rect x="215" y="235" width="155" height="3" rx="1" fill="#B8952A" fill-opacity="0.25"/>
  <rect x="215" y="250" width="162" height="3" rx="1" fill="#B8952A" fill-opacity="0.25"/>
  <rect x="215" y="265" width="140" height="3" rx="1" fill="#B8952A" fill-opacity="0.25"/>
  <rect x="215" y="280" width="168" height="3" rx="1" fill="#B8952A" fill-opacity="0.2"/>
  <rect x="215" y="295" width="130" height="3" rx="1" fill="#B8952A" fill-opacity="0.2"/>
  <!-- Sello lacre rojo -->
  <circle cx="300" cy="395" r="32" fill="#8B1A1A" fill-opacity="0.85"/>
  <circle cx="300" cy="395" r="28" fill="#8B1A1A"/>
  <!-- Corona/escudo en el lacre -->
  <path d="M288,388 L292,378 L300,384 L308,378 L312,388 L308,398 L292,398Z" fill="#FFFFFF" fill-opacity="0.25"/>
  <!-- Pluma de escribir -->
  <path d="M440,180 Q500,140 510,120 Q480,160 470,210 Q460,240 450,230 Q440,220 440,180Z" fill="#A8A8A8" fill-opacity="0.5"/>
  <line x1="445" y1="190" x2="390" y2="320" stroke="#A8A8A8" stroke-width="2" stroke-opacity="0.35"/>


<!-- Línea dorada inferior -->
<rect x="40" y="620" width="520" height="0.8" fill="url(#shine_carta_robada)"/>

<!-- Título -->
<text x="300" y="670" font-family="Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">La carta robada</text>


<!-- Autor -->
<text x="300" y="710" font-family="Georgia, serif" font-size="13" fill="#B8952A" text-anchor="middle" letter-spacing="2">EDGAR ALLAN POE</text>

<!-- Línea decorativa autor -->
<rect x="220" y="722" width="160" height="0.8" fill="#B8952A"/>

<!-- Borde rojo inferior -->
<rect x="0" y="895" width="600" height="5" fill="#8B1A1A"/>

<!-- Marca de agua PL -->
<text x="300" y="855" font-family="Georgia, serif" font-size="11" fill="#B8952A" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">PL · EDICIÓN POCKET</text>
</svg>