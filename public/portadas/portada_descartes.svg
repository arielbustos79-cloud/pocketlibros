<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <!-- Subtle rationalist grid -->
  <g stroke="#FFFFFF" stroke-width="0.25" opacity="0.05">
    <line x1="100" y1="0" x2="100" y2="620"/>
    <line x1="200" y1="0" x2="200" y2="620"/>
    <line x1="300" y1="0" x2="300" y2="620"/>
    <line x1="400" y1="0" x2="400" y2="620"/>
    <line x1="500" y1="0" x2="500" y2="620"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="0" y1="390" x2="600" y2="390"/>
    <line x1="0" y1="510" x2="600" y2="510"/>
  </g>
  <!-- Upper eye -->
  <path d="M95,268 Q198,178 300,174 Q402,178 505,268 Q402,358 300,362 Q198,358 95,268 Z" fill="#FFFFFF" opacity="0.04"/>
  <path d="M95,268 Q198,178 300,174 Q402,178 505,268" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.68"/>
  <path d="M95,268 Q198,358 300,362 Q402,358 505,268" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.68"/>
  <!-- Iris -->
  <circle cx="300" cy="268" r="68" fill="none" stroke="#B8952A" stroke-width="1.8" opacity="0.58"/>
  <circle cx="300" cy="268" r="44" fill="#B8952A" opacity="0.1"/>
  <!-- Pupil -->
  <circle cx="300" cy="268" r="22" fill="#06121E"/>
  <circle cx="300" cy="268" r="17" fill="#030A14"/>
  <!-- Iris radial lines -->
  <g stroke="#B8952A" stroke-width="0.7" opacity="0.22">
    <line x1="300" y1="200" x2="300" y2="246"/>
    <line x1="300" y1="290" x2="300" y2="336"/>
    <line x1="232" y1="268" x2="278" y2="268"/>
    <line x1="322" y1="268" x2="368" y2="268"/>
    <line x1="252" y1="220" x2="278" y2="246"/>
    <line x1="322" y1="290" x2="348" y2="316"/>
    <line x1="348" y1="220" x2="322" y2="246"/>
    <line x1="278" y1="290" x2="252" y2="316"/>
    <line x1="240" y1="248" x2="260" y2="260"/>
    <line x1="360" y1="248" x2="340" y2="260"/>
  </g>
  <!-- Highlight -->
  <circle cx="314" cy="255" r="6" fill="#FFFFFF" opacity="0.32"/>
  <!-- Upper lashes -->
  <g stroke="#FFFFFF" stroke-width="1.2" opacity="0.38" stroke-linecap="round">
    <line x1="178" y1="214" x2="173" y2="194"/>
    <line x1="220" y1="192" x2="218" y2="170"/>
    <line x1="262" y1="180" x2="262" y2="158"/>
    <line x1="300" y1="174" x2="300" y2="152"/>
    <line x1="338" y1="180" x2="338" y2="158"/>
    <line x1="380" y1="192" x2="382" y2="170"/>
    <line x1="422" y1="214" x2="427" y2="194"/>
  </g>
  <!-- Mirror / reflection axis -->
  <line x1="75" y1="422" x2="525" y2="422" stroke="#B8952A" stroke-width="0.8" stroke-dasharray="8,7" opacity="0.28"/>
  <!-- Reflected eye (inverted, faded) -->
  <path d="M122,498 Q210,438 300,435 Q390,438 478,498 Q390,556 300,559 Q210,556 122,498 Z" fill="none"/>
  <path d="M122,498 Q210,438 300,435 Q390,438 478,498" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.22"/>
  <path d="M122,498 Q210,556 300,559 Q390,556 478,498" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.22"/>
  <circle cx="300" cy="498" r="50" fill="none" stroke="#B8952A" stroke-width="1.2" opacity="0.18"/>
  <circle cx="300" cy="498" r="17" fill="#040E1A" opacity="0.6"/>
  <!-- Text area -->
  <line x1="50" y1="635" x2="120" y2="635" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="672" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#FFFFFF">Discurso del</text>
  <text x="50" y="716" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#FFFFFF">Método</text>
  <text x="50" y="752" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#B8952A" letter-spacing="2">Descartes</text>
  <text x="50" y="784" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="4">GRANDES PENSADORES</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
