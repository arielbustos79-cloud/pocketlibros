<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <g fill="#FFFFFF" opacity="0.38">
    <circle cx="80" cy="100" r="1.5"/>
    <circle cx="180" cy="72" r="1"/>
    <circle cx="355" cy="88" r="2"/>
    <circle cx="480" cy="62" r="1.5"/>
    <circle cx="542" cy="118" r="1"/>
    <circle cx="118" cy="162" r="1"/>
    <circle cx="462" cy="142" r="1"/>
  </g>
  <!-- Ocean darkness below horizon -->
  <rect x="0" y="385" width="600" height="260" fill="#071628" opacity="0.55"/>
  <!-- Horizon line -->
  <line x1="0" y1="385" x2="600" y2="385" stroke="#FFFFFF" stroke-width="0.5" opacity="0.1"/>
  <!-- Back-wave (behind main) -->
  <path d="M0,285 Q58,238 108,268 Q158,298 210,282 Q248,270 280,280" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.28" stroke-linecap="round"/>
  <!-- Wave underside -->
  <path d="M28,382 Q88,428 162,400 Q222,378 272,392 Q296,400 318,392" fill="none" stroke="#FFFFFF" stroke-width="1.4" opacity="0.3" stroke-linecap="round"/>
  <!-- Main wave – solid left portion (impression) -->
  <path d="M25,320 Q85,252 145,290 Q198,328 240,312 Q268,298 292,308" fill="none" stroke="#FFFFFF" stroke-width="3.2" opacity="0.82" stroke-linecap="round"/>
  <!-- Transition section -->
  <path d="M292,308 Q315,302 338,312" fill="none" stroke="#FFFFFF" stroke-width="2.6" opacity="0.55" stroke-linecap="round"/>
  <!-- Dissolving into particles (idea) -->
  <g fill="#FFFFFF">
    <circle cx="358" cy="315" r="4.2" opacity="0.44"/>
    <circle cx="374" cy="310" r="3.8" opacity="0.37"/>
    <circle cx="389" cy="320" r="3.2" opacity="0.3"/>
    <circle cx="403" cy="307" r="3" opacity="0.26"/>
    <circle cx="417" cy="317" r="2.6" opacity="0.22"/>
    <circle cx="430" cy="304" r="2.2" opacity="0.18"/>
    <circle cx="443" cy="315" r="2" opacity="0.15"/>
    <circle cx="455" cy="302" r="1.8" opacity="0.12"/>
    <circle cx="467" cy="313" r="1.5" opacity="0.1"/>
    <circle cx="478" cy="300" r="1.2" opacity="0.08"/>
    <!-- Scattered -->
    <circle cx="368" cy="298" r="2" opacity="0.2"/>
    <circle cx="382" cy="330" r="1.6" opacity="0.17"/>
    <circle cx="396" cy="290" r="1.5" opacity="0.15"/>
    <circle cx="410" cy="334" r="1.4" opacity="0.13"/>
    <circle cx="423" cy="292" r="1.2" opacity="0.11"/>
    <circle cx="436" cy="328" r="1.2" opacity="0.09"/>
    <circle cx="449" cy="288" r="1" opacity="0.08"/>
    <circle cx="460" cy="322" r="1" opacity="0.07"/>
    <circle cx="473" cy="292" r="0.8" opacity="0.06"/>
    <circle cx="485" cy="316" r="0.8" opacity="0.05"/>
    <!-- Far scatter -->
    <circle cx="496" cy="304" r="0.8" opacity="0.04"/>
    <circle cx="508" cy="315" r="0.7" opacity="0.03"/>
  </g>
  <!-- Impression / Idea labels -->
  <text x="130" y="262" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" opacity="0.48" text-anchor="middle" letter-spacing="2">IMPRESIÓN</text>
  <text x="448" y="268" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" opacity="0.38" text-anchor="middle" letter-spacing="2">IDEA</text>
  <line x1="192" y1="259" x2="372" y2="259" stroke="#B8952A" stroke-width="0.7" stroke-dasharray="4,7" opacity="0.22"/>
  <path d="M369,254 L377,259 L369,264" fill="none" stroke="#B8952A" stroke-width="0.7" opacity="0.22"/>
  <!-- Text area -->
  <line x1="50" y1="635" x2="120" y2="635" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="669" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#FFFFFF">Tratado de la</text>
  <text x="50" y="711" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#FFFFFF">Naturaleza</text>
  <text x="50" y="748" font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#B8952A" letter-spacing="2">Hume</text>
  <text x="50" y="780" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="4">GRANDES PENSADORES</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
