<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
<defs>
  <linearGradient id="bg_lupin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111111"/>
    <stop offset="100%" stop-color="#1C1C1C"/>
  </linearGradient>
  <linearGradient id="shine_lupin" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#B8952A" stop-opacity="0"/>
    <stop offset="50%" stop-color="#B8952A" stop-opacity="1"/>
    <stop offset="100%" stop-color="#B8952A" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Fondo -->
<rect width="600" height="900" fill="url(#bg_lupin)"/>

<!-- Borde rojo superior -->
<rect x="0" y="0" width="600" height="5" fill="#8B1A1A"/>

<!-- Colección top -->
<text x="300" y="38" font-family="Georgia, serif" font-size="11" fill="#B8952A" text-anchor="middle" letter-spacing="4" font-weight="normal">NOVELA NEGRA</text>
<text x="300" y="58" font-family="Georgia, serif" font-size="9" fill="#A8A8A8" text-anchor="middle" letter-spacing="3">POCKET LIBROS</text>

<!-- Línea dorada superior -->
<rect x="40" y="68" width="520" height="0.8" fill="url(#shine_lupin)"/>

<!-- Ilustración central -->

  <!-- Luna de fondo -->
  <circle cx="300" cy="340" r="100" fill="#8B1A1A" fill-opacity="0.12"/>
  <circle cx="300" cy="340" r="95" fill="none" stroke="#8B1A1A" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Capa -->
  <path d="M220,580 Q300,420 380,580 Q340,490 300,480 Q260,490 220,580Z" fill="#A8A8A8" fill-opacity="0.85"/>
  <!-- Cuerpo -->
  <rect x="275" y="430" width="50" height="100" rx="4" fill="#A8A8A8" fill-opacity="0.9"/>
  <!-- Cuello/pañuelo dorado -->
  <path d="M285,430 L300,460 L315,430 Z" fill="#B8952A"/>
  <!-- Cabeza -->
  <ellipse cx="300" cy="390" rx="35" ry="40" fill="#A8A8A8" fill-opacity="0.9"/>
  <!-- Sombrero copa -->
  <rect x="262" y="348" width="76" height="8" rx="4" fill="#A8A8A8"/>
  <rect x="272" y="298" width="56" height="52" rx="3" fill="#A8A8A8"/>
  <!-- Monóculo (dorado) -->
  <circle cx="312" cy="392" r="10" fill="none" stroke="#B8952A" stroke-width="2"/>
  <line x1="322" y1="392" x2="332" y2="396" stroke="#B8952A" stroke-width="1.5"/>
  <!-- Bastón -->
  <line x1="350" y1="500" x2="390" y2="600" stroke="#B8952A" stroke-width="3"/>
  <ellipse cx="390" cy="600" rx="8" ry="5" fill="#B8952A"/>
  <!-- Diamante (carta) pequeño -->
  <polygon points="545,120 560,140 545,160 530,140" fill="#8B1A1A" fill-opacity="0.8"/>


<!-- Línea dorada inferior -->
<rect x="40" y="620" width="520" height="0.8" fill="url(#shine_lupin)"/>

<!-- Título -->
<text x="300" y="670" font-family="Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Arsène Lupin</text>
<text x="300" y="705" font-family="Georgia, serif" font-size="14" fill="#A8A8A8" text-anchor="middle" font-style="italic">ladrón de guante blanco</text>

<!-- Autor -->
<text x="300" y="740" font-family="Georgia, serif" font-size="13" fill="#B8952A" text-anchor="middle" letter-spacing="2">MAURICE LEBLANC</text>

<!-- Línea decorativa autor -->
<rect x="220" y="752" width="160" height="0.8" fill="#B8952A"/>

<!-- Borde rojo inferior -->
<rect x="0" y="895" width="600" height="5" fill="#8B1A1A"/>

<!-- Marca de agua PL -->
<text x="300" y="855" font-family="Georgia, serif" font-size="11" fill="#B8952A" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">PL · EDICIÓN POCKET</text>
</svg>