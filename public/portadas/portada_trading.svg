<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <!-- Background grid -->
  <g stroke="#1A4070" stroke-width="0.6" opacity="0.5">
    <line x1="50" y1="180" x2="550" y2="180"/>
    <line x1="50" y1="270" x2="550" y2="270"/>
    <line x1="50" y1="360" x2="550" y2="360"/>
    <line x1="50" y1="450" x2="550" y2="450"/>
    <line x1="50" y1="540" x2="550" y2="540"/>
    <line x1="150" y1="140" x2="150" y2="580"/>
    <line x1="250" y1="140" x2="250" y2="580"/>
    <line x1="350" y1="140" x2="350" y2="580"/>
    <line x1="450" y1="140" x2="450" y2="580"/>
  </g>
  <!-- Arrow body -->
  <line x1="120" y1="520" x2="430" y2="200" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <!-- Arrow head -->
  <polygon points="430,200 390,220 420,250" fill="#FFFFFF"/>
  <polygon points="430,200 450,240 410,235" fill="#FFFFFF"/>
  <!-- Gold accent dot at origin -->
  <circle cx="120" cy="520" r="8" fill="#B8952A"/>
  <!-- Trailing dots -->
  <circle cx="185" cy="455" r="4" fill="#B8952A" opacity="0.6"/>
  <circle cx="250" cy="390" r="4" fill="#B8952A" opacity="0.6"/>
  <circle cx="315" cy="325" r="4" fill="#B8952A" opacity="0.6"/>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="678" font-family="Georgia,'Times New Roman',serif" font-size="37" fill="#FFFFFF">Trading para</text>
  <text x="50" y="724" font-family="Georgia,'Times New Roman',serif" font-size="37" fill="#FFFFFF">Principiantes</text>
  <text x="50" y="770" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">TRADING</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
