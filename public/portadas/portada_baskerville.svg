<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
<defs>
  <linearGradient id="bg_baskerville" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111111"/>
    <stop offset="100%" stop-color="#1C1C1C"/>
  </linearGradient>
  <linearGradient id="shine_baskerville" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#B8952A" stop-opacity="0"/>
    <stop offset="50%" stop-color="#B8952A" stop-opacity="1"/>
    <stop offset="100%" stop-color="#B8952A" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Fondo -->
<rect width="600" height="900" fill="url(#bg_baskerville)"/>

<!-- Borde rojo superior -->
<rect x="0" y="0" width="600" height="5" fill="#8B1A1A"/>

<!-- Colección top -->
<text x="300" y="38" font-family="Georgia, serif" font-size="11" fill="#B8952A" text-anchor="middle" letter-spacing="4" font-weight="normal">NOVELA NEGRA</text>
<text x="300" y="58" font-family="Georgia, serif" font-size="9" fill="#A8A8A8" text-anchor="middle" letter-spacing="3">POCKET LIBROS</text>

<!-- Línea dorada superior -->
<rect x="40" y="68" width="520" height="0.8" fill="url(#shine_baskerville)"/>

<!-- Ilustración central -->

  <!-- Luna llena -->
  <circle cx="300" cy="260" r="110" fill="#A8A8A8" fill-opacity="0.12"/>
  <circle cx="300" cy="260" r="105" fill="#A8A8A8" fill-opacity="0.08"/>
  <circle cx="300" cy="260" r="96" fill="#A8A8A8" fill-opacity="0.15"/>
  <!-- Silueta sabueso (cuerpo) -->
  <ellipse cx="300" cy="480" rx="115" ry="55" fill="#111111"/>
  <ellipse cx="300" cy="482" rx="110" ry="50" fill="#A8A8A8" fill-opacity="0.75"/>
  <!-- Patas -->
  <rect x="195" y="520" width="22" height="55" rx="8" fill="#A8A8A8" fill-opacity="0.75"/>
  <rect x="230" y="530" width="22" height="50" rx="8" fill="#A8A8A8" fill-opacity="0.75"/>
  <rect x="350" y="530" width="22" height="50" rx="8" fill="#A8A8A8" fill-opacity="0.75"/>
  <rect x="385" y="520" width="22" height="55" rx="8" fill="#A8A8A8" fill-opacity="0.75"/>
  <!-- Cuello y cabeza -->
  <ellipse cx="390" cy="440" rx="38" ry="30" fill="#A8A8A8" fill-opacity="0.75"/>
  <ellipse cx="415" cy="425" rx="30" ry="28" fill="#A8A8A8" fill-opacity="0.75"/>
  <!-- Hocico -->
  <ellipse cx="440" cy="440" rx="22" ry="14" fill="#A8A8A8" fill-opacity="0.7"/>
  <!-- Ojo (rojo) -->
  <circle cx="422" cy="420" r="6" fill="#8B1A1A"/>
  <circle cx="424" cy="418" r="2" fill="#FFFFFF" fill-opacity="0.6"/>
  <!-- Cola -->
  <path d="M185,460 Q150,430 160,400" fill="none" stroke="#A8A8A8" stroke-width="14" stroke-linecap="round" stroke-opacity="0.75"/>
  <!-- Oreja caída -->
  <ellipse cx="405" cy="415" rx="10" ry="22" fill="#A8A8A8" fill-opacity="0.5" transform="rotate(-20,405,415)"/>
  <!-- Niebla/pantano base -->
  <ellipse cx="300" cy="590" rx="250" ry="25" fill="#A8A8A8" fill-opacity="0.06"/>
  <!-- Huella de pata (dorado) -->
  <ellipse cx="90" cy="585" rx="18" ry="12" fill="#B8952A" fill-opacity="0.5"/>
  <ellipse cx="78" cy="570" rx="7" ry="5" fill="#B8952A" fill-opacity="0.5"/>
  <ellipse cx="91" cy="566" rx="7" ry="5" fill="#B8952A" fill-opacity="0.5"/>
  <ellipse cx="103" cy="570" rx="7" ry="5" fill="#B8952A" fill-opacity="0.5"/>


<!-- Línea dorada inferior -->
<rect x="40" y="620" width="520" height="0.8" fill="url(#shine_baskerville)"/>

<!-- Título -->
<text x="300" y="670" font-family="Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">El sabueso de</text>
<text x="300" y="705" font-family="Georgia, serif" font-size="14" fill="#A8A8A8" text-anchor="middle" font-style="italic">los Baskerville</text>

<!-- Autor -->
<text x="300" y="740" font-family="Georgia, serif" font-size="13" fill="#B8952A" text-anchor="middle" letter-spacing="2">ARTHUR CONAN DOYLE</text>

<!-- Línea decorativa autor -->
<rect x="220" y="752" width="160" height="0.8" fill="#B8952A"/>

<!-- Borde rojo inferior -->
<rect x="0" y="895" width="600" height="5" fill="#8B1A1A"/>

<!-- Marca de agua PL -->
<text x="300" y="855" font-family="Georgia, serif" font-size="11" fill="#B8952A" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">PL · EDICIÓN POCKET</text>
</svg>