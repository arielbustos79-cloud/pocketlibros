<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
<defs>
  <linearGradient id="bg_escarlata" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111111"/>
    <stop offset="100%" stop-color="#1C1C1C"/>
  </linearGradient>
  <linearGradient id="shine_escarlata" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#B8952A" stop-opacity="0"/>
    <stop offset="50%" stop-color="#B8952A" stop-opacity="1"/>
    <stop offset="100%" stop-color="#B8952A" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Fondo -->
<rect width="600" height="900" fill="url(#bg_escarlata)"/>

<!-- Borde rojo superior -->
<rect x="0" y="0" width="600" height="5" fill="#8B1A1A"/>

<!-- Colección top -->
<text x="300" y="38" font-family="Georgia, serif" font-size="11" fill="#B8952A" text-anchor="middle" letter-spacing="4" font-weight="normal">NOVELA NEGRA</text>
<text x="300" y="58" font-family="Georgia, serif" font-size="9" fill="#A8A8A8" text-anchor="middle" letter-spacing="3">POCKET LIBROS</text>

<!-- Línea dorada superior -->
<rect x="40" y="68" width="520" height="0.8" fill="url(#shine_escarlata)"/>

<!-- Ilustración central -->

  <!-- Salpicadura escarlata de fondo -->
  <circle cx="300" cy="320" r="120" fill="#8B1A1A" fill-opacity="0.18"/>
  <circle cx="300" cy="320" r="110" fill="#8B1A1A" fill-opacity="0.1"/>
  <!-- Gotas escarlata -->
  <circle cx="420" cy="240" r="18" fill="#8B1A1A" fill-opacity="0.35"/>
  <circle cx="430" cy="268" r="8" fill="#8B1A1A" fill-opacity="0.3"/>
  <circle cx="180" cy="280" r="14" fill="#8B1A1A" fill-opacity="0.3"/>
  <circle cx="165" cy="305" r="6" fill="#8B1A1A" fill-opacity="0.25"/>
  <!-- Lupa (gran, central) -->
  <circle cx="295" cy="315" r="105" fill="none" stroke="#A8A8A8" stroke-width="7" stroke-opacity="0.75"/>
  <circle cx="295" cy="315" r="97" fill="#8B1A1A" fill-opacity="0.08"/>
  <!-- Interior lupa: silueta Baker Street 221B -->
  <rect x="250" y="270" width="90" height="110" rx="3" fill="#A8A8A8" fill-opacity="0.2"/>
  <!-- Ventanas -->
  <rect x="260" y="280" width="28" height="35" rx="2" fill="#B8952A" fill-opacity="0.4"/>
  <rect x="302" y="280" width="28" height="35" rx="2" fill="#B8952A" fill-opacity="0.4"/>
  <!-- Puerta -->
  <rect x="275" y="340" width="40" height="40" rx="2" fill="#A8A8A8" fill-opacity="0.3"/>
  <text x="296" y="364" font-family="Georgia,serif" font-size="9" fill="#B8952A" fill-opacity="0.7" text-anchor="middle">221B</text>
  <!-- Mango lupa (dorado) -->
  <line x1="375" y1="390" x2="460" y2="480" stroke="#B8952A" stroke-width="13" stroke-linecap="round"/>
  <line x1="378" y1="384" x2="458" y2="474" stroke="#B8952A" stroke-width="5" stroke-linecap="round" stroke-opacity="0.5"/>
  <!-- Big Ben (silueta, fondo) -->
  <rect x="70" y="240" width="32" height="180" fill="#A8A8A8" fill-opacity="0.12"/>
  <rect x="60" y="230" width="52" height="20" rx="2" fill="#A8A8A8" fill-opacity="0.12"/>
  <rect x="72" y="210" width="28" height="22" rx="2" fill="#A8A8A8" fill-opacity="0.12"/>
  <rect x="80" y="195" width="12" height="16" rx="1" fill="#A8A8A8" fill-opacity="0.15"/>
  <!-- Letra SCARLET (eco) -->
  <text x="295" y="330" font-family="Georgia,serif" font-size="28" fill="#8B1A1A" fill-opacity="0.2" text-anchor="middle" font-weight="bold">SCARLET</text>


<!-- Línea dorada inferior -->
<rect x="40" y="620" width="520" height="0.8" fill="url(#shine_escarlata)"/>

<!-- Título -->
<text x="300" y="670" font-family="Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Estudio en</text>
<text x="300" y="705" font-family="Georgia, serif" font-size="14" fill="#A8A8A8" text-anchor="middle" font-style="italic">Escarlata</text>

<!-- Autor -->
<text x="300" y="740" font-family="Georgia, serif" font-size="13" fill="#B8952A" text-anchor="middle" letter-spacing="2">ARTHUR CONAN DOYLE</text>

<!-- Línea decorativa autor -->
<rect x="220" y="752" width="160" height="0.8" fill="#B8952A"/>

<!-- Borde rojo inferior -->
<rect x="0" y="895" width="600" height="5" fill="#8B1A1A"/>

<!-- Marca de agua PL -->
<text x="300" y="855" font-family="Georgia, serif" font-size="11" fill="#B8952A" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">PL · EDICIÓN POCKET</text>
</svg>