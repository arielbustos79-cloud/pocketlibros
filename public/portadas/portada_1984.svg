<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <!-- Surveillance grid lines radiating from eye -->
  <g stroke="#1A4070" stroke-width="0.5" opacity="0.6">
    <line x1="300" y1="320" x2="50" y2="480"/>
    <line x1="300" y1="320" x2="550" y2="480"/>
    <line x1="300" y1="320" x2="100" y2="560"/>
    <line x1="300" y1="320" x2="500" y2="560"/>
    <line x1="300" y1="320" x2="150" y2="600"/>
    <line x1="300" y1="320" x2="450" y2="600"/>
    <line x1="300" y1="320" x2="200" y2="620"/>
    <line x1="300" y1="320" x2="400" y2="620"/>
    <line x1="300" y1="320" x2="50" y2="600"/>
    <line x1="300" y1="320" x2="550" y2="600"/>
  </g>
  <!-- City silhouette (bottom) -->
  <rect x="0" y="480" width="600" height="160" fill="#0D2B4E"/>
  <g fill="#1A4070" opacity="0.8">
    <rect x="50" y="500" width="40" height="140"/>
    <rect x="105" y="470" width="35" height="170"/>
    <rect x="155" y="510" width="45" height="130"/>
    <rect x="215" y="485" width="30" height="155"/>
    <rect x="260" y="500" width="50" height="140"/>
    <rect x="325" y="475" width="40" height="165"/>
    <rect x="380" y="505" width="35" height="135"/>
    <rect x="430" y="490" width="45" height="150"/>
    <rect x="490" y="470" width="35" height="170"/>
    <rect x="540" y="500" width="40" height="140"/>
  </g>
  <!-- Eye socket / outer form -->
  <path d="M100,320 Q300,160 500,320 Q300,480 100,320 Z" fill="#0D2B4E" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <!-- Iris -->
  <circle cx="300" cy="320" r="72" fill="#1A4070"/>
  <circle cx="300" cy="320" r="72" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
  <!-- Pupil -->
  <circle cx="300" cy="320" r="40" fill="#0D2B4E"/>
  <circle cx="300" cy="320" r="40" fill="none" stroke="#B8952A" stroke-width="2" opacity="0.8"/>
  <!-- Iris detail rings -->
  <circle cx="300" cy="320" r="56" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.2"/>
  <!-- Eye glint -->
  <circle cx="318" cy="302" r="8" fill="#FFFFFF" opacity="0.15"/>
  <!-- Red center dot (surveillance symbol) -->
  <circle cx="300" cy="320" r="6" fill="#E53E3E" opacity="0.9"/>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="693" font-family="Georgia,'Times New Roman',serif" font-size="58" fill="#FFFFFF">1984</text>
  <text x="50" y="748" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">CLÁSICO</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
