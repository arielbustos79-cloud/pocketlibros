<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <defs>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8952A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B8952A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Connections - normal -->
  <line x1="300" y1="200" x2="160" y2="320" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="200" x2="440" y2="320" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <line x1="160" y1="320" x2="120" y2="470" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <line x1="440" y1="320" x2="480" y2="470" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
  <!-- Connection under stress (broken/red) -->
  <line x1="160" y1="320" x2="300" y2="440" stroke="#E53E3E" stroke-width="1.5" stroke-dasharray="10,8" opacity="0.8"/>
  <line x1="300" y1="440" x2="440" y2="320" stroke="#E53E3E" stroke-width="1.5" stroke-dasharray="10,8" opacity="0.8"/>
  <!-- Normal nodes -->
  <circle cx="300" cy="200" r="28" fill="#0D2B4E" stroke="#B8952A" stroke-width="2"/>
  <circle cx="300" cy="200" r="12" fill="#B8952A"/>
  <circle cx="160" cy="320" r="22" fill="#0D2B4E" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="160" cy="320" r="10" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="440" cy="320" r="22" fill="#0D2B4E" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="440" cy="320" r="10" fill="#FFFFFF" opacity="0.8"/>
  <!-- Stressed nodes (red) -->
  <circle cx="300" cy="440" r="24" fill="#0D2B4E" stroke="#E53E3E" stroke-width="2"/>
  <circle cx="300" cy="440" r="10" fill="#E53E3E" opacity="0.9"/>
  <circle cx="120" cy="470" r="20" fill="#0D2B4E" stroke="#E53E3E" stroke-width="1.5" opacity="0.7"/>
  <circle cx="120" cy="470" r="8" fill="#E53E3E" opacity="0.6"/>
  <circle cx="480" cy="470" r="20" fill="#0D2B4E" stroke="#E53E3E" stroke-width="1.5" opacity="0.7"/>
  <circle cx="480" cy="470" r="8" fill="#E53E3E" opacity="0.6"/>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="678" font-family="Georgia,'Times New Roman',serif" font-size="37" fill="#FFFFFF">Supply Chain</text>
  <text x="50" y="724" font-family="Georgia,'Times New Roman',serif" font-size="37" fill="#FFFFFF">en Crisis</text>
  <text x="50" y="770" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">OPERACIONES</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
