<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
<defs>
  <linearGradient id="bg_cuarto_amarillo" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111111"/>
    <stop offset="100%" stop-color="#1C1C1C"/>
  </linearGradient>
  <linearGradient id="shine_cuarto_amarillo" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#B8952A" stop-opacity="0"/>
    <stop offset="50%" stop-color="#B8952A" stop-opacity="1"/>
    <stop offset="100%" stop-color="#B8952A" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Fondo -->
<rect width="600" height="900" fill="url(#bg_cuarto_amarillo)"/>

<!-- Borde rojo superior -->
<rect x="0" y="0" width="600" height="5" fill="#8B1A1A"/>

<!-- Colección top -->
<text x="300" y="38" font-family="Georgia, serif" font-size="11" fill="#B8952A" text-anchor="middle" letter-spacing="4" font-weight="normal">NOVELA NEGRA</text>
<text x="300" y="58" font-family="Georgia, serif" font-size="9" fill="#A8A8A8" text-anchor="middle" letter-spacing="3">POCKET LIBROS</text>

<!-- Línea dorada superior -->
<rect x="40" y="68" width="520" height="0.8" fill="url(#shine_cuarto_amarillo)"/>

<!-- Ilustración central -->

  <!-- Marco puerta exterior -->
  <rect x="160" y="170" width="280" height="410" rx="6" fill="none" stroke="#A8A8A8" stroke-width="3" stroke-opacity="0.3"/>
  <!-- Puerta -->
  <rect x="170" y="180" width="260" height="390" rx="4" fill="#A8A8A8" fill-opacity="0.08"/>
  <!-- Panel superior puerta -->
  <rect x="190" y="200" width="100" height="100" rx="3" fill="none" stroke="#A8A8A8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="310" y="200" width="100" height="100" rx="3" fill="none" stroke="#A8A8A8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Panel inferior puerta -->
  <rect x="190" y="320" width="100" height="220" rx="3" fill="none" stroke="#A8A8A8" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="310" y="320" width="100" height="220" rx="3" fill="none" stroke="#A8A8A8" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Luz amarilla/dorada del cuarto filtrada -->
  <rect x="170" y="180" width="260" height="390" rx="4" fill="#B8952A" fill-opacity="0.06"/>
  <!-- Ojo de cerradura grande (central, el elemento principal) -->
  <circle cx="300" cy="380" r="38" fill="#111111" stroke="#B8952A" stroke-width="3"/>
  <path d="M285,380 Q285,410 300,430 Q315,410 315,380Z" fill="#111111" stroke="#B8952A" stroke-width="2.5"/>
  <!-- Brillo del ojo de cerradura -->
  <circle cx="300" cy="375" r="25" fill="#B8952A" fill-opacity="0.15"/>
  <!-- Perilla/manilla (dorada) -->
  <circle cx="420" cy="380" r="16" fill="#B8952A" fill-opacity="0.6" stroke="#B8952A" stroke-width="2"/>
  <circle cx="420" cy="380" r="8" fill="#111111"/>
  <!-- Sombra bajo la puerta — luz del cuarto (amarilla) -->
  <rect x="170" y="568" width="260" height="4" fill="#B8952A" fill-opacity="0.25"/>
  <!-- Texto cuarto amarillo (eco) -->
  <text x="300" y="490" font-family="Georgia,serif" font-size="11" fill="#B8952A" fill-opacity="0.25" text-anchor="middle" letter-spacing="3">CHAMBRE JAUNE</text>


<!-- Línea dorada inferior -->
<rect x="40" y="620" width="520" height="0.8" fill="url(#shine_cuarto_amarillo)"/>

<!-- Título -->
<text x="300" y="670" font-family="Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">El misterio del</text>
<text x="300" y="705" font-family="Georgia, serif" font-size="14" fill="#A8A8A8" text-anchor="middle" font-style="italic">cuarto amarillo</text>

<!-- Autor -->
<text x="300" y="740" font-family="Georgia, serif" font-size="13" fill="#B8952A" text-anchor="middle" letter-spacing="2">GASTON LEROUX</text>

<!-- Línea decorativa autor -->
<rect x="220" y="752" width="160" height="0.8" fill="#B8952A"/>

<!-- Borde rojo inferior -->
<rect x="0" y="895" width="600" height="5" fill="#8B1A1A"/>

<!-- Marca de agua PL -->
<text x="300" y="855" font-family="Georgia, serif" font-size="11" fill="#B8952A" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">PL · EDICIÓN POCKET</text>
</svg>