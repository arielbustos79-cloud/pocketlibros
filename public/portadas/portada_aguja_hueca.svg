<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
<defs>
  <linearGradient id="bg_aguja_hueca" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111111"/>
    <stop offset="100%" stop-color="#1C1C1C"/>
  </linearGradient>
  <linearGradient id="shine_aguja_hueca" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#B8952A" stop-opacity="0"/>
    <stop offset="50%" stop-color="#B8952A" stop-opacity="1"/>
    <stop offset="100%" stop-color="#B8952A" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Fondo -->
<rect width="600" height="900" fill="url(#bg_aguja_hueca)"/>

<!-- Borde rojo superior -->
<rect x="0" y="0" width="600" height="5" fill="#8B1A1A"/>

<!-- Colección top -->
<text x="300" y="38" font-family="Georgia, serif" font-size="11" fill="#B8952A" text-anchor="middle" letter-spacing="4" font-weight="normal">NOVELA NEGRA</text>
<text x="300" y="58" font-family="Georgia, serif" font-size="9" fill="#A8A8A8" text-anchor="middle" letter-spacing="3">POCKET LIBROS</text>

<!-- Línea dorada superior -->
<rect x="40" y="68" width="520" height="0.8" fill="url(#shine_aguja_hueca)"/>

<!-- Ilustración central -->

  <!-- Mar/horizonte -->
  <rect x="40" y="430" width="520" height="170" rx="0" fill="#A8A8A8" fill-opacity="0.05"/>
  <path d="M40,430 Q150,415 300,425 Q450,435 560,420 L560,600 L40,600Z" fill="#A8A8A8" fill-opacity="0.07"/>
  <!-- Reflejo en agua -->
  <path d="M250,440 Q300,435 350,440 L330,520 L270,520Z" fill="#B8952A" fill-opacity="0.06"/>
  <!-- Acantilados de Étretat (izquierda) -->
  <path d="M40,430 Q80,400 100,380 Q110,360 120,340 Q130,300 140,280 Q150,250 160,230 L200,430Z" fill="#A8A8A8" fill-opacity="0.45"/>
  <!-- Acantilados (derecha) -->
  <path d="M560,430 Q520,400 500,380 Q490,360 480,340 Q470,300 460,280 Q450,250 440,230 L400,430Z" fill="#A8A8A8" fill-opacity="0.35"/>
  <!-- LA AGUJA (roca central) — icónica aguja de piedra -->
  <path d="M285,100 L270,430 L330,430 L315,100Z" fill="#A8A8A8" fill-opacity="0.7"/>
  <!-- Arco en la aguja (el hueco) -->
  <ellipse cx="300" cy="350" rx="18" ry="35" fill="#111111"/>
  <!-- Punta aguja (dorada) -->
  <polygon points="285,100 315,100 300,78" fill="#B8952A" fill-opacity="0.8"/>
  <!-- Castillo al fondo (silueta simple) -->
  <rect x="80" y="310" width="80" height="100" fill="#A8A8A8" fill-opacity="0.25"/>
  <rect x="75" y="295" width="18" height="30" fill="#A8A8A8" fill-opacity="0.25"/><!-- torre izq -->
  <rect x="147" y="295" width="18" height="30" fill="#A8A8A8" fill-opacity="0.25"/><!-- torre der -->
  <!-- Gaviotas (simple) -->
  <path d="M430,180 Q440,172 450,180" fill="none" stroke="#A8A8A8" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M460,160 Q470,152 480,160" fill="none" stroke="#A8A8A8" stroke-width="2" stroke-opacity="0.5"/>


<!-- Línea dorada inferior -->
<rect x="40" y="620" width="520" height="0.8" fill="url(#shine_aguja_hueca)"/>

<!-- Título -->
<text x="300" y="670" font-family="Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">La aguja hueca</text>


<!-- Autor -->
<text x="300" y="710" font-family="Georgia, serif" font-size="13" fill="#B8952A" text-anchor="middle" letter-spacing="2">MAURICE LEBLANC</text>

<!-- Línea decorativa autor -->
<rect x="220" y="722" width="160" height="0.8" fill="#B8952A"/>

<!-- Borde rojo inferior -->
<rect x="0" y="895" width="600" height="5" fill="#8B1A1A"/>

<!-- Marca de agua PL -->
<text x="300" y="855" font-family="Georgia, serif" font-size="11" fill="#B8952A" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">PL · EDICIÓN POCKET</text>
</svg>