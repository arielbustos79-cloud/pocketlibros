<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <!-- Fire / flames in background -->
  <g opacity="0.35">
    <path d="M340,280 Q360,220 380,260 Q400,200 420,250 Q440,180 460,240 Q480,200 490,280 Q470,340 420,360 Q380,340 340,280 Z" fill="#E53E3E"/>
    <path d="M380,300 Q400,250 420,280 Q440,230 455,290 Q440,360 410,370 Q385,355 380,300 Z" fill="#FBD38D"/>
    <path d="M280,320 Q295,270 310,300 Q325,250 340,295 Q325,370 300,380 Q278,365 280,320 Z" fill="#E53E3E"/>
  </g>
  <!-- Moscow skyline (dim) -->
  <g fill="#1A4070" opacity="0.4">
    <!-- Kremlin / onion domes -->
    <rect x="200" y="380" width="200" height="160"/>
    <path d="M240,380 Q260,340 280,380 Z" fill="#1A4070" opacity="0.5"/>
    <path d="M300,380 Q320,340 340,380 Z" fill="#1A4070" opacity="0.5"/>
    <path d="M360,380 Q380,340 400,380 Z" fill="#1A4070" opacity="0.5"/>
    <!-- Towers -->
    <rect x="185" y="360" width="25" height="180"/>
    <rect x="388" y="360" width="25" height="180"/>
    <rect x="220" y="350" width="18" height="40"/>
    <rect x="360" y="350" width="18" height="40"/>
  </g>
  <!-- Smoke -->
  <g opacity="0.12" fill="#FFFFFF">
    <ellipse cx="400" cy="200" rx="60" ry="40"/>
    <ellipse cx="440" cy="160" rx="50" ry="35"/>
    <ellipse cx="470" cy="130" rx="40" ry="28"/>
    <ellipse cx="330" cy="220" rx="50" ry="35"/>
  </g>
  <!-- Soldier silhouette (foreground, right) -->
  <!-- Head + helmet -->
  <ellipse cx="440" cy="350" rx="26" ry="24" fill="#FFFFFF" opacity="0.75"/>
  <path d="M414,342 Q440,318 466,342 L468,356 L412,356 Z" fill="#FFFFFF" opacity="0.6"/>
  <!-- Body + coat -->
  <path d="M414,374 Q405,460 400,530 Q420,545 440,540 Q460,545 480,530 Q475,460 466,374 Z" fill="#FFFFFF" opacity="0.7"/>
  <!-- Cape -->
  <path d="M410,380 Q380,450 375,540 Q410,550 420,530 L420,380 Z" fill="#FFFFFF" opacity="0.5"/>
  <!-- Rifle -->
  <line x1="470" y1="370" x2="510" y2="270" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="508" y1="272" x2="500" y2="260" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="678" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#FFFFFF">La Guerra</text>
  <text x="50" y="724" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#FFFFFF">y la Paz</text>
  <text x="50" y="770" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">CLÁSICO</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
