<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D030A"/>
      <stop offset="50%" stop-color="#1A0510"/>
      <stop offset="100%" stop-color="#100308"/>
    </linearGradient>
    <linearGradient id="key_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4A870"/>
      <stop offset="40%" stop-color="#C4956A"/>
      <stop offset="100%" stop-color="#9A7040"/>
    </linearGradient>
    <radialGradient id="key_glow" cx="50%" cy="40%" r="28%">
      <stop offset="0%" stop-color="#C4956A" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1A0510" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#key_glow)"/>

  <!-- Línea dorada superior -->
  <rect x="50" y="46" width="500" height="1"   fill="#C4956A" opacity="0.6"/>
  <rect x="50" y="50" width="500" height="0.4" fill="#C4956A" opacity="0.25"/>

  <!-- Branding -->
  <text x="300" y="80" font-family="Georgia, serif" font-size="11" fill="#C4956A"
        text-anchor="middle" letter-spacing="5" opacity="0.85">POCKET LIBROS</text>
  <text x="300" y="97" font-family="Georgia, serif" font-size="10" fill="#F2E8D0"
        text-anchor="middle" letter-spacing="3" opacity="0.35" font-style="italic">ficción adulta</text>

  <!-- ═══ PUERTA DE DEPARTAMENTO — muy sutil al fondo ═══ -->
  <rect x="190" y="185" width="220" height="320" rx="3"
        fill="none" stroke="#F2E8D0" stroke-width="1.2" opacity="0.07"/>
  <!-- Paneles de la puerta -->
  <rect x="208" y="202" width="184" height="130" rx="2"
        fill="none" stroke="#F2E8D0" stroke-width="0.8" opacity="0.05"/>
  <rect x="208" y="348" width="184" height="140" rx="2"
        fill="none" stroke="#F2E8D0" stroke-width="0.8" opacity="0.05"/>
  <!-- Número "5B" en la puerta -->
  <text x="300" y="290" font-family="Georgia, serif" font-size="28" fill="#F2E8D0"
        text-anchor="middle" opacity="0.06" font-weight="bold">5B</text>

  <!-- ═══ LLAVE — elemento central ═══ -->
  <!-- Halo suave -->
  <circle cx="300" cy="355" r="105" fill="#C4956A" opacity="0.05"/>
  <circle cx="300" cy="355" r="88"  fill="#C4956A" opacity="0.06"/>

  <!-- Anillo de la llave — grueso y dorado -->
  <circle cx="300" cy="325" r="80"  fill="none" stroke="url(#key_grad)" stroke-width="26" opacity="0.94"/>

  <!-- Ojo interior de la llave (hueco con fondo oscuro) -->
  <circle cx="300" cy="325" r="32"  fill="#130208" opacity="0.96"/>
  <!-- Borde del ojo -->
  <circle cx="300" cy="325" r="32"  fill="none" stroke="#C4956A" stroke-width="2.5" opacity="0.45"/>

  <!-- Texto "5B" dentro del anillo de la llave -->
  <text x="300" y="333" font-family="Georgia, serif" font-size="22" font-weight="bold"
        fill="#C4956A" text-anchor="middle" opacity="0.90">5B</text>

  <!-- Varilla principal de la llave -->
  <rect x="287" y="403" width="26" height="180" rx="5" fill="url(#key_grad)" opacity="0.93"/>

  <!-- Dientes de la llave (hacia la derecha) -->
  <rect x="313" y="440" width="26" height="20" rx="3" fill="url(#key_grad)" opacity="0.90"/>
  <rect x="313" y="478" width="20" height="17" rx="3" fill="url(#key_grad)" opacity="0.88"/>
  <rect x="313" y="516" width="24" height="18" rx="3" fill="url(#key_grad)" opacity="0.86"/>

  <!-- Punta de la llave -->
  <rect x="284" y="576" width="32" height="10" rx="3" fill="url(#key_grad)" opacity="0.88"/>

  <!-- Brillos en el metal de la llave -->
  <path d="M 293,272 Q 304,263 313,274"
        stroke="#F2E8D0" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M 290,412 Q 295,408 300,412"
        stroke="#F2E8D0" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.45"/>
  <path d="M 290,460 Q 295,457 300,460"
        stroke="#F2E8D0" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.30"/>

  <!-- ═══ DOS SILUETAS DIMINUTAS al fondo — muy sutiles ═══ -->
  <!-- Silueta femenina izquierda -->
  <ellipse cx="138" cy="485" rx="11" ry="13" fill="#F2E8D0" opacity="0.11"/>
  <path d="M 138,498 Q 130,540 126,600 L 150,600 Q 146,540 138,498 Z"
        fill="#F2E8D0" opacity="0.09"/>
  <!-- Silueta masculina derecha -->
  <ellipse cx="462" cy="480" rx="12" ry="14" fill="#F2E8D0" opacity="0.09"/>
  <path d="M 462,494 Q 454,535 450,592 L 474,592 Q 472,535 462,494 Z"
        fill="#F2E8D0" opacity="0.08"/>

  <!-- Separadores -->
  <line x1="50"  y1="618" x2="145" y2="618" stroke="#C4956A" stroke-width="0.6" opacity="0.38"/>
  <line x1="455" y1="618" x2="550" y2="618" stroke="#C4956A" stroke-width="0.6" opacity="0.38"/>

  <!-- Título -->
  <text x="300" y="668" font-family="Georgia, serif" font-size="11" fill="#C4956A"
        text-anchor="middle" letter-spacing="4" opacity="0.75" font-style="italic">RELATO ADULTO · +18</text>
  <rect x="50" y="674" width="500" height="0.8" fill="#C4956A" opacity="0.35"/>
  <text x="300" y="710" font-family="Georgia, serif" font-size="26" font-weight="bold"
        fill="#F2E8D0" text-anchor="middle">La Llave</text>
  <text x="300" y="750" font-family="Georgia, serif" font-size="38" font-weight="bold"
        fill="#F2E8D0" text-anchor="middle">del 5B</text>

  <!-- Línea inferior -->
  <rect x="50" y="766" width="500" height="0.8" fill="#C4956A" opacity="0.35"/>
</svg>
