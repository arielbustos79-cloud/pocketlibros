<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <defs>
    <!-- Eating window arc (8h gold) -->
    <!-- Fasting window arc (16h dim) -->
  </defs>
  <!-- Clock outer ring -->
  <circle cx="300" cy="360" r="200" fill="#0D2B4E" stroke="#1A4070" stroke-width="2"/>
  <!-- Fasting sector (16h: 8am to midnight = 240 degrees of arc) -->
  <!-- Using path for arc sector: fasting = gray, eating = gold -->
  <!-- Full circle background dim -->
  <circle cx="300" cy="360" r="195" fill="#1A4070" opacity="0.25"/>
  <!-- Eating window: 8h sector (noon to 8pm roughly = top to right) -->
  <!-- Arc from -90deg to 150deg = 240 degrees = fasting (gray) -->
  <!-- Arc from 150deg to 270deg = eating window = 120 degrees = gold -->
  <!-- Eating window arc (120°, from 270° to 30° = 8h) using SVG arc -->
  <path d="M300,160 A200,200 0 0,1 473,460 L300,360 Z" fill="#B8952A" opacity="0.18"/>
  <path d="M300,160 A200,200 0 0,1 473,460" fill="none" stroke="#B8952A" stroke-width="6" opacity="0.9"/>
  <!-- Fasting ring -->
  <path d="M473,460 A200,200 0 1,1 300,160" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.2"/>
  <!-- Clock center -->
  <circle cx="300" cy="360" r="8" fill="#B8952A"/>
  <!-- Hour markers -->
  <g fill="#FFFFFF" opacity="0.5">
    <rect x="297" y="165" width="6" height="20" rx="3"/><!-- 12 -->
    <rect x="496" y="357" width="20" height="6" rx="3"/><!-- 3 -->
    <rect x="297" y="549" width="6" height="20" rx="3"/><!-- 6 -->
    <rect x="84" y="357" width="20" height="6" rx="3"/><!-- 9 -->
  </g>
  <!-- Labels -->
  <text x="300" y="152" font-family="Georgia,serif" font-size="13" fill="#FFFFFF" text-anchor="middle" opacity="0.7">12h</text>
  <text x="490" y="480" font-family="Georgia,serif" font-size="13" fill="#B8952A" text-anchor="middle">8h</text>
  <text x="300" y="575" font-family="Georgia,serif" font-size="13" fill="#FFFFFF" text-anchor="middle" opacity="0.7">20h</text>
  <!-- Window labels -->
  <text x="420" y="310" font-family="Georgia,serif" font-size="12" fill="#B8952A" text-anchor="middle" opacity="0.9">ALIMENTACIÓN</text>
  <text x="190" y="420" font-family="Georgia,serif" font-size="12" fill="#FFFFFF" text-anchor="middle" opacity="0.4">AYUNO</text>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="678" font-family="Georgia,'Times New Roman',serif" font-size="37" fill="#FFFFFF">Ayuno</text>
  <text x="50" y="724" font-family="Georgia,'Times New Roman',serif" font-size="37" fill="#FFFFFF">Intermitente</text>
  <text x="50" y="770" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">SALUD</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
