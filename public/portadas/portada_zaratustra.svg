  <path d="M-20,520 Q60,490 120,400 Q165,328 148,268 Q185,248 218,208 L252,320 Q272,405 295,450 Z" fill="#0A1E36"/>
  <!-- Central mountain (tallest, peak at top) -->
  <path d="M88,580 Q170,548 244,455 Q282,395 300,318 Q318,395 356,455 Q430,548 512,580 Z" fill="#071628"/>
  <path d="M88,580 Q170,548 244,455 Q282,395 300,318 Q318,395 356,455 Q430,548 512,580 Z" fill="none" stroke="#1A3A5C" stroke-width="1.2" opacity="0.45"/>
  <!-- Right mountain -->
