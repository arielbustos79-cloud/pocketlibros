<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#130208"/>
      <stop offset="50%" stop-color="#1A0510"/>
      <stop offset="100%" stop-color="#0E0208"/>
    </linearGradient>
    <radialGradient id="sol_iquique" cx="50%" cy="40%" r="38%">
      <stop offset="0%" stop-color="#C4956A" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#C4956A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#1A0510" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pies_glow" cx="50%" cy="68%" r="30%">
      <stop offset="0%" stop-color="#F2E8D0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1A0510" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="900" fill="url(#bg)"/>
  <rect width="600" height="900" fill="url(#sol_iquique)"/>
  <rect width="600" height="900" fill="url(#pies_glow)"/>

  <!-- Línea dorada superior -->
  <rect x="50" y="46" width="500" height="1"   fill="#C4956A" opacity="0.6"/>
  <rect x="50" y="50" width="500" height="0.4" fill="#C4956A" opacity="0.25"/>

  <!-- Branding -->
  <text x="300" y="80" font-family="Georgia, serif" font-size="11" fill="#C4956A"
        text-anchor="middle" letter-spacing="5" opacity="0.85">POCKET LIBROS</text>
  <text x="300" y="97" font-family="Georgia, serif" font-size="10" fill="#F2E8D0"
        text-anchor="middle" letter-spacing="3" opacity="0.35" font-style="italic">ficción adulta</text>

  <!-- ═══ PIERNAS — desde arriba, convergiendo hacia los pies ═══ -->
  <!-- Pierna izquierda -->
  <path d="M 185,135 Q 210,300 228,460 Q 238,560 250,640"
        stroke="#F2E8D0" stroke-width="52" stroke-linecap="round" fill="none" opacity="0.80"/>
  <!-- Pierna derecha -->
  <path d="M 415,135 Q 390,300 372,460 Q 362,560 350,640"
        stroke="#F2E8D0" stroke-width="52" stroke-linecap="round" fill="none" opacity="0.80"/>

  <!-- Sombra de piernas más oscura en el centro (separación visual) -->
  <path d="M 300,200 Q 300,350 300,650" stroke="#130208" stroke-width="22" fill="none" opacity="0.35"/>

  <!-- ═══ PIES — protagonistas ═══ -->
  <!-- Pie izquierdo (visto desde arriba, ligeramente girado) -->
  <ellipse cx="236" cy="662" rx="48" ry="20" fill="#F2E8D0" opacity="0.88" transform="rotate(12 236 662)"/>
  <!-- Dedos pie izquierdo (de mayor a menor, izquierda a derecha) -->
  <ellipse cx="198" cy="650" rx="9"  ry="7"  fill="#F2E8D0" opacity="0.84" transform="rotate(15 198 650)"/>
  <ellipse cx="212" cy="643" rx="8"  ry="6.5" fill="#F2E8D0" opacity="0.84" transform="rotate(12 212 643)"/>
  <ellipse cx="226" cy="640" rx="7.5" ry="6" fill="#F2E8D0" opacity="0.83" transform="rotate(10 226 640)"/>
  <ellipse cx="239" cy="640" rx="7"  ry="5.5" fill="#F2E8D0" opacity="0.82" transform="rotate(8 239 640)"/>
  <ellipse cx="252" cy="642" rx="6"  ry="5"  fill="#F2E8D0" opacity="0.80" transform="rotate(5 252 642)"/>
  <!-- Uñas doradas pie izquierdo -->
  <ellipse cx="198" cy="648" rx="5.5" ry="4" fill="#C4956A" opacity="0.92" transform="rotate(15 198 648)"/>
  <ellipse cx="212" cy="641" rx="5"  ry="3.5" fill="#C4956A" opacity="0.90" transform="rotate(12 212 641)"/>
  <ellipse cx="226" cy="638" rx="4.5" ry="3.5" fill="#C4956A" opacity="0.88" transform="rotate(10 226 638)"/>
  <ellipse cx="239" cy="638" rx="4"  ry="3"  fill="#C4956A" opacity="0.86" transform="rotate(8 239 638)"/>
  <ellipse cx="252" cy="640" rx="3.5" ry="2.5" fill="#C4956A" opacity="0.83" transform="rotate(5 252 640)"/>

  <!-- Pie derecho (espejado) -->
  <ellipse cx="364" cy="662" rx="48" ry="20" fill="#F2E8D0" opacity="0.88" transform="rotate(-12 364 662)"/>
  <!-- Dedos pie derecho -->
  <ellipse cx="348" cy="642" rx="6"  ry="5"  fill="#F2E8D0" opacity="0.80" transform="rotate(-5 348 642)"/>
  <ellipse cx="361" cy="640" rx="7"  ry="5.5" fill="#F2E8D0" opacity="0.82" transform="rotate(-8 361 640)"/>
  <ellipse cx="374" cy="640" rx="7.5" ry="6" fill="#F2E8D0" opacity="0.83" transform="rotate(-10 374 640)"/>
  <ellipse cx="388" cy="643" rx="8"  ry="6.5" fill="#F2E8D0" opacity="0.84" transform="rotate(-12 388 643)"/>
  <ellipse cx="402" cy="650" rx="9"  ry="7"  fill="#F2E8D0" opacity="0.84" transform="rotate(-15 402 650)"/>
  <!-- Uñas doradas pie derecho -->
  <ellipse cx="348" cy="640" rx="3.5" ry="2.5" fill="#C4956A" opacity="0.83" transform="rotate(-5 348 640)"/>
  <ellipse cx="361" cy="638" rx="4"  ry="3"  fill="#C4956A" opacity="0.86" transform="rotate(-8 361 638)"/>
  <ellipse cx="374" cy="638" rx="4.5" ry="3.5" fill="#C4956A" opacity="0.88" transform="rotate(-10 374 638)"/>
  <ellipse cx="388" cy="641" rx="5"  ry="3.5" fill="#C4956A" opacity="0.90" transform="rotate(-12 388 641)"/>
  <ellipse cx="402" cy="648" rx="5.5" ry="4"  fill="#C4956A" opacity="0.92" transform="rotate(-15 402 648)"/>

  <!-- Tobillo (detalle) -->
  <ellipse cx="248" cy="678" rx="22" ry="12" fill="#F2E8D0" opacity="0.70" transform="rotate(8 248 678)"/>
  <ellipse cx="352" cy="678" rx="22" ry="12" fill="#F2E8D0" opacity="0.70" transform="rotate(-8 352 678)"/>

  <!-- Separadores -->
  <line x1="50"  y1="710" x2="148" y2="710" stroke="#C4956A" stroke-width="0.6" opacity="0.38"/>
  <line x1="452" y1="710" x2="550" y2="710" stroke="#C4956A" stroke-width="0.6" opacity="0.38"/>

  <!-- Título -->
  <text x="300" y="774" font-family="Georgia, serif" font-size="11" fill="#C4956A"
        text-anchor="middle" letter-spacing="4" opacity="0.75" font-style="italic">RELATO ADULTO · +18</text>
  <rect x="50" y="780" width="500" height="0.8" fill="#C4956A" opacity="0.35"/>
  <text x="300" y="816" font-family="Georgia, serif" font-size="26" font-weight="bold"
        fill="#F2E8D0" text-anchor="middle">Los Pies de</text>
  <text x="300" y="852" font-family="Georgia, serif" font-size="42" font-weight="bold"
        fill="#F2E8D0" text-anchor="middle">Sofía</text>

  <!-- Línea inferior -->
  <rect x="50" y="866" width="500" height="0.8" fill="#C4956A" opacity="0.35"/>
</svg>
