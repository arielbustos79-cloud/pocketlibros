<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
<defs>
  <linearGradient id="bg_piedra_lunar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111111"/>
    <stop offset="100%" stop-color="#1C1C1C"/>
  </linearGradient>
  <linearGradient id="shine_piedra_lunar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#B8952A" stop-opacity="0"/>
    <stop offset="50%" stop-color="#B8952A" stop-opacity="1"/>
    <stop offset="100%" stop-color="#B8952A" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- Fondo -->
<rect width="600" height="900" fill="url(#bg_piedra_lunar)"/>

<!-- Borde rojo superior -->
<rect x="0" y="0" width="600" height="5" fill="#8B1A1A"/>

<!-- Colección top -->
<text x="300" y="38" font-family="Georgia, serif" font-size="11" fill="#B8952A" text-anchor="middle" letter-spacing="4" font-weight="normal">NOVELA NEGRA</text>
<text x="300" y="58" font-family="Georgia, serif" font-size="9" fill="#A8A8A8" text-anchor="middle" letter-spacing="3">POCKET LIBROS</text>

<!-- Línea dorada superior -->
<rect x="40" y="68" width="520" height="0.8" fill="url(#shine_piedra_lunar)"/>

<!-- Ilustración central -->

  <!-- Luna creciente grande -->
  <circle cx="300" cy="320" r="150" fill="#A8A8A8" fill-opacity="0.1"/>
  <circle cx="340" cy="300" r="135" fill="#1C1C1C"/>
  <!-- Brillo luna -->
  <path d="M180,250 Q200,200 240,180" fill="none" stroke="#A8A8A8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Gema moonstone central -->
  <polygon points="300,200 380,310 350,430 250,430 220,310" fill="#A8A8A8" fill-opacity="0.2" stroke="#A8A8A8" stroke-width="2"/>
  <!-- Facetas internas -->
  <polygon points="300,200 380,310 300,315" fill="#FFFFFF" fill-opacity="0.08"/>
  <polygon points="300,200 220,310 300,315" fill="#A8A8A8" fill-opacity="0.08"/>
  <polygon points="300,315 380,310 350,430 250,430 220,310" fill="#A8A8A8" fill-opacity="0.05"/>
  <!-- Brillo piedra (dorado azulado) -->
  <ellipse cx="285" cy="280" rx="30" ry="50" fill="#FFFFFF" fill-opacity="0.1" transform="rotate(-15,285,280)"/>
  <!-- Destellos -->
  <line x1="300" y1="130" x2="300" y2="160" stroke="#B8952A" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="300" y1="175" x2="300" y2="195" stroke="#B8952A" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="420" y1="260" x2="400" y2="275" stroke="#B8952A" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="180" y1="260" x2="200" y2="275" stroke="#B8952A" stroke-width="2" stroke-opacity="0.8"/>
  <!-- Base/peana (india) -->
  <path d="M210,440 Q300,420 390,440 Q400,460 390,480 Q300,460 210,480 Q200,460 210,440Z" fill="#B8952A" fill-opacity="0.3"/>
  <!-- Ornamento indio -->
  <path d="M270,440 Q300,425 330,440" fill="none" stroke="#B8952A" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="300" cy="440" r="5" fill="#B8952A" fill-opacity="0.7"/>


<!-- Línea dorada inferior -->
<rect x="40" y="620" width="520" height="0.8" fill="url(#shine_piedra_lunar)"/>

<!-- Título -->
<text x="300" y="670" font-family="Georgia, serif" font-size="36" fill="#FFFFFF" text-anchor="middle" font-weight="bold">La piedra lunar</text>


<!-- Autor -->
<text x="300" y="710" font-family="Georgia, serif" font-size="13" fill="#B8952A" text-anchor="middle" letter-spacing="2">WILKIE COLLINS</text>

<!-- Línea decorativa autor -->
<rect x="220" y="722" width="160" height="0.8" fill="#B8952A"/>

<!-- Borde rojo inferior -->
<rect x="0" y="895" width="600" height="5" fill="#8B1A1A"/>

<!-- Marca de agua PL -->
<text x="300" y="855" font-family="Georgia, serif" font-size="11" fill="#B8952A" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">PL · EDICIÓN POCKET</text>
</svg>