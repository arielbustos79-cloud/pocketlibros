<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#060F1A"/>
  <defs>
    <radialGradient id="centerLight" cx="50%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#B8952A" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#B8952A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#B8952A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Central light glow -->
  <ellipse cx="300" cy="540" rx="160" ry="120" fill="url(#centerLight)"/>
  <!-- Concentric circles (9 circles of hell + purgatory + paradise) -->
  <circle cx="300" cy="320" r="260" fill="none" stroke="#1A4070" stroke-width="0.8" opacity="0.5"/>
  <circle cx="300" cy="320" r="220" fill="none" stroke="#1A4070" stroke-width="0.8" opacity="0.5"/>
  <circle cx="300" cy="320" r="180" fill="none" stroke="#1A4070" stroke-width="0.8" opacity="0.55"/>
  <circle cx="300" cy="320" r="145" fill="none" stroke="#1A4070" stroke-width="0.8" opacity="0.6"/>
  <circle cx="300" cy="320" r="112" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.25"/>
  <circle cx="300" cy="320" r="82" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.3"/>
  <circle cx="300" cy="320" r="56" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.35"/>
  <circle cx="300" cy="320" r="34" fill="none" stroke="#B8952A" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="320" r="16" fill="none" stroke="#B8952A" stroke-width="1.2" opacity="0.7"/>
  <!-- Spiral effect - diagonal lines suggesting depth -->
  <g stroke="#0D2B4E" stroke-width="8" opacity="0.6">
    <path d="M300,320 Q400,250 460,320 Q400,390 300,320" fill="none"/>
    <path d="M300,320 Q200,250 140,320 Q200,390 300,320" fill="none"/>
  </g>
  <!-- Descending figure (tiny silhouette at edge) -->
  <circle cx="300" cy="70" r="6" fill="#FFFFFF" opacity="0.6"/>
  <path d="M296,76 Q290,110 292,130 Q296,145 300,150 Q304,145 308,130 Q310,110 304,76 Z" fill="#FFFFFF" opacity="0.6"/>
  <!-- Path line descending spiral -->
  <path d="M300,80 Q380,150 380,240 Q380,340 300,380 Q220,420 220,500 Q220,560 300,560" fill="none" stroke="#B8952A" stroke-width="1.2" stroke-dasharray="6,8" opacity="0.4"/>
  <!-- Central light point -->
  <circle cx="300" cy="320" r="6" fill="#F0E6C0" opacity="0.95"/>
  <circle cx="300" cy="320" r="3" fill="#FFFFFF"/>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="678" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#FFFFFF">La Divina</text>
  <text x="50" y="724" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#FFFFFF">Comedia</text>
  <text x="50" y="770" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">CLÁSICO</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
