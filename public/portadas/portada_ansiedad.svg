<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <!-- Grid lines -->
  <g stroke="#1A4070" stroke-width="0.8" opacity="0.7">
    <line x1="80" y1="200" x2="520" y2="200"/>
    <line x1="80" y1="280" x2="520" y2="280"/>
    <line x1="80" y1="360" x2="520" y2="360"/>
    <line x1="80" y1="440" x2="520" y2="440"/>
    <line x1="80" y1="520" x2="520" y2="520"/>
    <line x1="150" y1="180" x2="150" y2="540"/>
    <line x1="230" y1="180" x2="230" y2="540"/>
    <line x1="310" y1="180" x2="310" y2="540"/>
    <line x1="390" y1="180" x2="390" y2="540"/>
    <line x1="470" y1="180" x2="470" y2="540"/>
  </g>
  <!-- Candle 1 - bearish -->
  <line x1="150" y1="200" x2="150" y2="480" stroke="#FC8181" stroke-width="1.5"/>
  <rect x="125" y="280" width="50" height="120" fill="#E53E3E"/>
  <!-- Candle 2 - bullish -->
  <line x1="230" y1="220" x2="230" y2="460" stroke="#68D391" stroke-width="1.5"/>
  <rect x="205" y="260" width="50" height="100" fill="#38A169"/>
  <!-- Candle 3 - bearish -->
  <line x1="310" y1="200" x2="310" y2="500" stroke="#FC8181" stroke-width="1.5"/>
  <rect x="285" y="240" width="50" height="140" fill="#E53E3E"/>
  <!-- Candle 4 - bullish -->
  <line x1="390" y1="240" x2="390" y2="480" stroke="#68D391" stroke-width="1.5"/>
  <rect x="365" y="280" width="50" height="80" fill="#38A169"/>
  <!-- Candle 5 - bearish -->
  <line x1="470" y1="200" x2="470" y2="520" stroke="#FC8181" stroke-width="1.5"/>
  <rect x="445" y="220" width="50" height="160" fill="#E53E3E"/>
  <!-- Stop-loss line -->
  <line x1="80" y1="330" x2="520" y2="330" stroke="#FC8181" stroke-width="2" stroke-dasharray="12,6" opacity="0.9"/>
  <text x="526" y="334" font-family="Georgia,serif" font-size="11" fill="#FC8181" opacity="0.9">STOP</text>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="675" font-family="Georgia,'Times New Roman',serif" font-size="35" fill="#FFFFFF">Domina tu</text>
  <text x="50" y="718" font-family="Georgia,'Times New Roman',serif" font-size="35" fill="#FFFFFF">Ansiedad al</text>
  <text x="50" y="761" font-family="Georgia,'Times New Roman',serif" font-size="35" fill="#FFFFFF">Invertir</text>
  <text x="50" y="800" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">TRADING</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
