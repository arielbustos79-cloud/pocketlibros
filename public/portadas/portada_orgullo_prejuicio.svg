<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <!-- Garden path -->
  <path d="M250,560 Q300,580 350,560 L380,600 L220,600 Z" fill="#1A4070" opacity="0.4"/>
  <!-- Garden flowers (simple circles) -->
  <g opacity="0.3">
    <circle cx="80" cy="520" r="8" fill="#B8952A"/>
    <circle cx="95" cy="490" r="6" fill="#FFFFFF"/>
    <circle cx="510" cy="510" r="8" fill="#B8952A"/>
    <circle cx="525" cy="480" r="6" fill="#FFFFFF"/>
    <circle cx="130" cy="530" r="5" fill="#B8952A"/>
    <circle cx="470" cy="525" r="5" fill="#B8952A"/>
    <!-- Stems -->
    <line x1="80" y1="528" x2="80" y2="560" stroke="#1A4070" stroke-width="1.5"/>
    <line x1="95" y1="496" x2="95" y2="560" stroke="#1A4070" stroke-width="1.5"/>
    <line x1="510" y1="518" x2="510" y2="560" stroke="#1A4070" stroke-width="1.5"/>
    <line x1="525" y1="486" x2="525" y2="560" stroke="#1A4070" stroke-width="1.5"/>
  </g>
  <!-- Ground / lawn -->
  <rect x="0" y="560" width="600" height="80" fill="#1A4070" opacity="0.2"/>
  <!-- Left figure (woman, elaborate dress) -->
  <!-- Head -->
  <ellipse cx="195" cy="220" rx="30" ry="34" fill="#FFFFFF" opacity="0.85"/>
  <!-- Bonnet -->
  <path d="M165,206 Q195,175 225,206 Q225,185 195,178 Q165,185 165,206 Z" fill="#FFFFFF" opacity="0.7"/>
  <!-- Neck -->
  <rect x="188" y="252" width="14" height="20" fill="#FFFFFF" opacity="0.85"/>
  <!-- Dress body -->
  <path d="M170,272 Q160,360 140,480 Q155,500 195,510 Q235,500 250,480 Q230,360 220,272 Z" fill="#FFFFFF" opacity="0.75"/>
  <!-- Dress skirt wide -->
  <path d="M140,420 Q100,500 110,540 Q150,570 195,560 Q240,570 280,540 Q290,500 250,420 Z" fill="#FFFFFF" opacity="0.65"/>
  <!-- Right figure (man, formal) -->
  <!-- Head -->
  <ellipse cx="405" cy="215" rx="28" ry="32" fill="#FFFFFF" opacity="0.7"/>
  <!-- Hat -->
  <rect x="377" y="183" width="56" height="14" rx="3" fill="#FFFFFF" opacity="0.7"/>
  <rect x="384" y="158" width="42" height="26" rx="2" fill="#FFFFFF" opacity="0.65"/>
  <!-- Neck + cravat -->
  <rect x="398" y="245" width="14" height="18" fill="#FFFFFF" opacity="0.7"/>
  <!-- Coat -->
  <path d="M377,263 Q365,370 360,480 Q380,495 405,495 Q430,495 450,480 Q445,370 433,263 Z" fill="#FFFFFF" opacity="0.6"/>
  <!-- Coat tails -->
  <path d="M360,400 Q340,490 355,540 L380,530 L380,400 Z" fill="#FFFFFF" opacity="0.5"/>
  <path d="M450,400 Q470,490 455,540 L430,530 L430,400 Z" fill="#FFFFFF" opacity="0.5"/>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="678" font-family="Georgia,'Times New Roman',serif" font-size="37" fill="#FFFFFF">Orgullo</text>
  <text x="50" y="724" font-family="Georgia,'Times New Roman',serif" font-size="37" fill="#FFFFFF">y Prejuicio</text>
  <text x="50" y="770" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">CLÁSICO</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
