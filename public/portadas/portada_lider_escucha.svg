<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#0D2B4E"/>
  <!-- Dividing line (subtle) -->
  <line x1="300" y1="160" x2="300" y2="580" stroke="#1A4070" stroke-width="1" opacity="0.5"/>
  <!-- Left figure (speaking) -->
  <!-- Head -->
  <circle cx="180" cy="240" r="42" fill="#FFFFFF" opacity="0.85"/>
  <!-- Body -->
  <path d="M138,290 Q130,420 160,460 Q180,475 200,460 Q230,420 222,290 Z" fill="#FFFFFF" opacity="0.85"/>
  <!-- Speech bubble -->
  <rect x="228" y="200" width="110" height="65" rx="8" fill="#B8952A" opacity="0.9"/>
  <polygon points="228,240 210,258 238,258" fill="#B8952A" opacity="0.9"/>
  <!-- Dots in speech bubble -->
  <circle cx="258" cy="232" r="6" fill="#0D2B4E"/>
  <circle cx="283" cy="232" r="6" fill="#0D2B4E"/>
  <circle cx="308" cy="232" r="6" fill="#0D2B4E"/>
  <!-- Right figure (listening) -->
  <!-- Head - slightly turned -->
  <circle cx="420" cy="240" r="42" fill="#FFFFFF" opacity="0.7"/>
  <!-- Body -->
  <path d="M378,290 Q370,420 400,460 Q420,475 440,460 Q470,420 462,290 Z" fill="#FFFFFF" opacity="0.7"/>
  <!-- Ear accent -->
  <path d="M382,232 Q370,245 374,258 Q380,265 388,258" fill="none" stroke="#B8952A" stroke-width="3" stroke-linecap="round"/>
  <!-- Sound waves -->
  <path d="M355,232 Q348,245 352,258" fill="none" stroke="#B8952A" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <path d="M342,225 Q332,244 337,264" fill="none" stroke="#B8952A" stroke-width="1.2" opacity="0.4" stroke-linecap="round"/>
  <!-- Text area -->
  <line x1="50" y1="638" x2="120" y2="638" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="678" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#FFFFFF">El Líder</text>
  <text x="50" y="724" font-family="Georgia,'Times New Roman',serif" font-size="38" fill="#FFFFFF">que Escucha</text>
  <text x="50" y="770" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#B8952A" letter-spacing="4">LIDERAZGO</text>
  <line x1="50" y1="855" x2="550" y2="855" stroke="#B8952A" stroke-width="0.5" opacity="0.3"/>
  <text x="300" y="872" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
