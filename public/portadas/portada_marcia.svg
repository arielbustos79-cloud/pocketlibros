<svg viewBox="0 0 600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#1A0510"/>
  <defs>
    <radialGradient id="warmGlow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#C4956A" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#8B3A5A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A0510" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silhouette" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2E8D0"/>
      <stop offset="100%" stop-color="#D4C0A0"/>
    </linearGradient>
    <linearGradient id="silhouetteDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4C0A0"/>
      <stop offset="100%" stop-color="#B8A080"/>
    </linearGradient>
  </defs>
  <!-- Warm atmosphere glow -->
  <rect width="600" height="900" fill="url(#warmGlow)"/>
  <!-- Flowing fabric lines (background) -->
  <g stroke="#C4956A" stroke-width="0.6" opacity="0.18" fill="none">
    <path d="M400,80 Q480,200 460,400 Q440,550 400,600"/>
    <path d="M420,80 Q510,220 490,430 Q470,580 420,640"/>
    <path d="M440,80 Q530,240 510,460 Q490,600 440,680"/>
    <path d="M150,100 Q80,250 100,450 Q120,600 160,700"/>
    <path d="M170,80 Q90,230 115,440 Q140,590 180,690"/>
  </g>
  <!-- Head -->
  <ellipse cx="290" cy="210" rx="52" ry="60" fill="url(#silhouette)" opacity="0.95"/>
  <!-- Hair flowing down -->
  <path d="M250,200 Q220,260 225,360 Q228,420 240,480" fill="none" stroke="url(#silhouetteDark)" stroke-width="30" stroke-linecap="round" opacity="0.9"/>
  <path d="M260,195 Q230,270 238,380 Q243,440 255,500" fill="none" stroke="#B8A080" stroke-width="20" stroke-linecap="round" opacity="0.7"/>
  <!-- Hair accent highlight -->
  <path d="M252,200 Q226,268 232,365" fill="none" stroke="#B8952A" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <!-- Neck -->
  <rect x="276" y="265" width="28" height="35" fill="url(#silhouette)" opacity="0.92"/>
  <!-- Shoulder / décolleté -->
  <path d="M230,300 Q255,285 290,295 Q325,285 360,300 Q390,330 400,380 L400,620 L200,620 L200,380 Q210,330 230,300 Z" fill="url(#silhouette)" opacity="0.92"/>
  <!-- Elegant neckline curve -->
  <path d="M240,300 Q270,280 300,290 Q330,280 360,300" fill="none" stroke="#B8952A" stroke-width="1.2" opacity="0.6"/>
  <!-- Flowing dress / fabric at bottom -->
  <path d="M200,500 Q160,580 140,700 L460,700 Q440,580 400,500" fill="url(#silhouetteDark)" opacity="0.85"/>
  <!-- Gold jewel accent at neck -->
  <circle cx="300" cy="298" r="5" fill="#B8952A" opacity="0.9"/>
  <ellipse cx="300" cy="298" rx="9" ry="5" fill="none" stroke="#B8952A" stroke-width="0.8" opacity="0.6"/>
  <!-- Floor shadow -->
  <ellipse cx="300" cy="710" rx="110" ry="12" fill="#000" opacity="0.25"/>
  <!-- Text area -->
  <line x1="50" y1="738" x2="120" y2="738" stroke="#B8952A" stroke-width="1.5"/>
  <text x="50" y="775" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#FFFFFF">A los pies</text>
  <text x="50" y="818" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#FFFFFF">de Marcia</text>
  <text x="50" y="855" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="4">LITERATURA · ERÓTICA</text>
  <line x1="50" y1="870" x2="550" y2="870" stroke="#B8952A" stroke-width="0.5" opacity="0.4"/>
  <text x="300" y="887" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B8952A" letter-spacing="5" text-anchor="middle">POCKET LIBROS</text>
</svg>
